<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Learnify</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./Assets/8d8916bfd0f682977d7cdf4213decf1e.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="main-style.css">
  <style>
    /* Loader */
    #pageLoader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0d6efd;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
    #pageLoader .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #fff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Login form */
    body {
      background-color: #f8f9fa;
    }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #0d6efd;
    }
    .btn-login {
      background-color: #0d6efd;
      border: none;
    }
    .btn-login:hover {
      background-color: #0b5ed7;
    }
    .form-link {
      display: block;
      text-align: center;
      margin-top: 10px;
    }
    .form-check-label {
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="pageLoader">
    <div class="loader"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <img src="./Assets/8d8916bfd0f682977d7cdf4213decf1e.png" alt="Logo" width="30">
        Learnify
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="new-htmlfile.html">HTML</a></li>
          <li class="nav-item"><a class="nav-link" href="cssfile.html">CSS</a></li>
          <li class="nav-item"><a class="nav-link" href="jsfile.html">JavaScript</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Password" required>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-login btn-block">Login</button>
      </div>
      <a href="contact.html" class="form-link">Forgot Password?</a>
      <a href="register.html" class="form-link">Create an account</a>
    </form>
    <div id="loginMessage" class="mt-3"></div>
  </div>

  <!-- Footer -->
  <footer class="footer mt-5 bg-dark text-white py-4">
    <div class="container text-center">
      © 2026 LearnCode. All Rights Reserved.
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Page JS -->
  <script>
    // Loader
    window.addEventListener("load", () => {
      const loader = document.getElementById("pageLoader");
      if(loader){
        loader.classList.add("hidden");
        setTimeout(()=>loader.remove(), 500);
      }
    });

    // Login form functionality (placeholder)
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', function(e){
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      // Placeholder: simple validation
      if(email === "Adilinamdar617@gmail.com" && password === "1234"){
        loginMessage.innerHTML = `<div class="alert alert-success">
          Login successful! ${rememberMe ? "We'll remember you." : ""}
        </div>`;
        setTimeout(()=>{ window.location.href = "home.html"; }, 1500);
      } else {
        loginMessage.innerHTML = '<div class="alert alert-danger">Invalid email or password</div>';
      }
    });
  </script>
</body>
</html>
